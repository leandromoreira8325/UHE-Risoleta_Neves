name: Monitoramento Macrófitas UHE Risoleta Neves

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # ADICIONE ESTE PASSO PARA INSTALAR AS DEPENDÊNCIAS CORRETAMENTE
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy pandas matplotlib shapely geopandas rasterio requests pyproj fpdf2

    - name: Run main script
      run: python main.py
