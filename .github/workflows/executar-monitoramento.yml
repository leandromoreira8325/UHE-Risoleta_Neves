name: Processamento Sentinel-2 e Relatorio Macrofitas UHE Risoleta Neves

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-and-process:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar Dependências Geoespaciais e de Relatório
        run: |
          python -m pip install --upgrade pip
          pip install numpy rasterio geopandas matplotlib shapely requests fpdf2 pyyaml pystac-client reportlab

      - name: Executar Pipeline (Risoleta Neves)
        env:
          CDSE_CLIENT_ID: ${{ secrets.CDSE_CLIENT_ID }}
          CDSE_CLIENT_SECRET: ${{ secrets.CDSE_CLIENT_SECRET }}
        run: |
          python main.py config/uhe_risoleta_neves.yaml

      - name: Upload do Relatório PDF como Artefato
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-mensal-macrofitas-risoleta-neves
          path: outputs/uhe_risoleta_neves/relatorio_mensal.pdf

      - name: Commit e Push dos Arquivos Gerados (Outputs)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add outputs/
          git status
          git commit -m "auto: atualização das pranchas e PDF UHE Risoleta Neves [skip ci]" || echo "Nenhuma alteração registrada."
          git push
